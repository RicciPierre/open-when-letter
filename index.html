    <body>
        <!-- WELCOME PAGE -->

        <section class="welcome-page" id="welcome-page">

            <div class="christmas-ornament" aria-hidden="true">
                ✧ ───── ❦ ───── ✧
            </div>

            <img
                src="images/good-boy.jpg"
                alt="Good boy"
                class="welcome-image"
            />

            <h1>As-tu été un good boy ?</h1>

            <p id="welcome-response" aria-live="polite"></p>

            <div class="welcome-choices">

                <button type="button"
                        class="welcome-button"
                        id="welcome-yes">
                    Oui 
                </button>

                <button type="button"
                        class="welcome-button"
                        id="welcome-no">
                    Non
                </button>

            </div>

            <footer class="calendar-footer">
                ❦ &nbsp; ✧ &nbsp; ❦
            </footer>

        </section>
